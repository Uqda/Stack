name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: linux, goarch: arm, goarm: '7', ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
          - { goos: freebsd, goarch: amd64, ext: '' }
          - { goos: openbsd, goarch: amd64, ext: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.13
          cache: true
      - name: Build reproducible binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION="$(cat VERSION)"
          OUTPUT="uqda-stack-v${VERSION}-${GOOS}-${GOARCH}${GOARM}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/Uqda/Core/src/version.buildName=uqda-stack -X github.com/Uqda/Core/src/version.buildVersion=${VERSION}" \
            -o "dist/${OUTPUT}" ./cmd/uqda-stack
      - uses: actions/upload-artifact@v6
        with:
          name: uqda-stack-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums, provenance and GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum uqda-stack-* > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest with GitHub OIDC
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/uqda-stack-*
      - name: Verify and create release tag
        id: release
        run: |
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "release/${TAG}" ]; then
            echo "release branch ${GITHUB_REF_NAME} does not match release/${TAG}" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "release tag ${TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "UQDA Stack ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --verify-tag \
            --title "UQDA Stack ${{ steps.release.outputs.tag }}" \
            --generate-notes
